name: Build dev APK

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: build-dev-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true

      - name: Provide Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: echo "MAPS_API_KEY=${MAPS_API_KEY}" >> android/local.properties

      - name: Provide Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64}" ]; then
            echo "${GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > android/app/google-services.json
            echo "Wrote android/app/google-services.json"
          else
            echo "No GOOGLE_SERVICES_JSON_BASE64 secret set; building without Firebase (push notifications disabled)."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}" \
            --dart-define=API_BASE_URL="${API_BASE_URL}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reelpin-dev-debug-${{ github.run_number }}-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
