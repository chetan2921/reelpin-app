name: Validate dev

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: validate-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Check architecture
        run: dart run tool/check_architecture.dart

      - name: Check image assets
        run: dart run tool/check_assets.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
